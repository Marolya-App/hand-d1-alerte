# Capture Phase 0 : observer lnh.fr PENDANT un vrai match.
#
# Pourquoi ici et pas sur le PC : le projet doit fonctionner machine eteinte.
# Autant valider l'hebergement en meme temps que la source de donnees.
#
# GitHub Actions ne sait pas planifier une date unique, mais un cron avec jour
# et mois fixes ne se declenche qu'une fois par an, ce qui suffit.
#
# ATTENTION : les crons GitHub sont en UTC, et les runners aussi. Le 29/08/2026
# Paris est en CEST, soit UTC+2. D'ou TZ ci-dessous : sans elle, les horodatages
# des captures seraient decales de 2 h et impossibles a recouper avec le match.

name: Capture live

on:
  schedule:
    # 14h35 UTC = 16h35 Paris — 25 min avant le match de 17h00.
    - cron: '35 14 29 8 *'
    # 17h35 UTC = 19h35 Paris — 25 min avant la finale de 20h00.
    - cron: '35 17 29 8 *'
  workflow_dispatch:
    inputs:
      minutes:
        description: 'Duree de la capture, en minutes'
        required: false
        default: '340'

# Tout le job raisonne en heure de Paris, comme lnh.fr.
env:
  TZ: Europe/Paris

jobs:
  capture:
    runs-on: ubuntu-latest
    # 360 min est le plafond GitHub pour un job.
    timeout-minutes: 360

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Un job par match, avec une duree taillee pour chacun. Le second doit
      # encaisser le pire cas d'une finale : temps reglementaire, deux
      # prolongations de 2x5 min et une seance de tirs au but.
      - name: Determiner la duree
        id: duree
        run: |
          case "${{ github.event.schedule }}" in
            "35 14 29 8 *") echo "minutes=195" >> "$GITHUB_OUTPUT" ;;
            "35 17 29 8 *") echo "minutes=355" >> "$GITHUB_OUTPUT" ;;
            *)              echo "minutes=${{ inputs.minutes || '340' }}" >> "$GITHUB_OUTPUT" ;;
          esac

      - name: Capture
        run: |
          echo "Heure de depart (Paris) : $(date)"
          node recon/capture-live.js --minutes ${{ steps.duree.outputs.minutes }}

      - name: Recuperer les captures
        # always() : meme si le job expire, on veut ce qui a ete vu.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: captures-${{ github.run_id }}
          path: recon/captures/
          if-no-files-found: warn
          retention-days: 30
